<h1>Iniciar sesión - Biblioteca</h1>

<form (ngSubmit)="iniciarSesion()">

  <label>Usuario</label>
  <input
    type="text"
    name="usuario"
    [(ngModel)]="usuario"
    required>

  <label>Contraseña</label>
  <input
    type="password"
    name="clave"
    [(ngModel)]="clave"
    required>

  <button type="submit">Ingresar</button>

</form>
