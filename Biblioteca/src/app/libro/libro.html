<main>
 <h1>Registro de libros</h1>

  <button type="button" (click)="cerrarSesion()">
    Cerrar sesión
  </button>

  <h2>Listado de libros</h2>

  <p>Total de libros: {{ libros.length }}</p>

  @if (libros.length === 0) {
    <p>No hay libros registrados.</p>
  } @else {
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Titulo</th>
          <th>Autor</th>
        </tr>
      </thead>
      <tbody>
        @for (libro of libros; track libro.id) {
          <tr>
            <td>{{ libro.id }}</td>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
          </tr>
        }
      </tbody>
    </table>
    }
</main>
