
<main>
  <h1>Registro de libros</h1>

  <button type="button" (click)="cerrarSesion()">
    Cerrar sesión
  </button>

  <h2>Registrar libro</h2>

  <form (ngSubmit)="guardar()">

    <label for="titulo">Título</label>
    <input
      id="titulo"
      type="text"
      name="titulo"
      [(ngModel)]="titulo"
      required>

    <label for="autor">Autor</label>
    <input
      id="autor"
      type="text"
      name="autor"
      [(ngModel)]="autor"
      required>

    <label for="id">ID</label>
    <input
      id="id"
      type="number"
      name="id"
      [(ngModel)]="id"
      min="0"
      step="1"
      required>

    <button type="submit">Guardar</button>

    <button type="button" (click)="limpiar()">
      Limpiar
    </button>
  </form>

  <h2>Listado de libros</h2>

  <p>Total de libros: {{ libros.length }}</p>

  @if (libros.length === 0) {
    <p>No hay libros registrados.</p>
  } @else {
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Titulo</th>
          <th>Autor</th>
        </tr>
      </thead>
      <tbody>
        @for (libro of libros; track libro.id) {
          <tr>
            <td>{{ libro.id }}</td>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</main>
